
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discover Your World</title>

    <!-- Favicon -->
    <link rel="icon" href="https://edube.org/uploads/media/default/0001/04/web-favicon.png">

    <!-- External JavaScript -->
    <script src="script.js"></script>
</head>
<body>
    <h1>&#x1F30D; Discover Your World</h1>

    <p>
        Explore the continents and discover their unique geographical features.
        Click on a continent to learn more about its rivers, mountains, and landmarks.
    </p>

    <!-- Geolocation Button -->
    <button id="getLocation">Discover Location</button>

    <!-- Interactive World Map -->
    <img
        src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg"
        alt="World Map"
        usemap="#worldmap"
    >

    <map name="worldmap">
        <area alt="North America" title="North America"
              id="north-america" shape="rect"
              coords="41,17,386,283" href="#">

        <area alt="South America" title="South America"
              id="south-america" shape="rect"
              coords="209,501,358,288" href="#">

        <area alt="Europe" title="Europe"
              id="europe" shape="rect"
              coords="391,68,505,217" href="#">

        <area alt="Africa" title="Africa"
              id="africa" shape="rect"
              coords="533,217,387,448" href="#">

        <area alt="Asia" title="Asia"
              id="asia" shape="rect"
              coords="893,153,506,1" href="#">

        <area alt="Australia and Oceania" title="Australia and Oceania"
              id="australia-and-oceania" shape="rect"
              coords="679,353,872,480" href="#">
    </map>
</body>
</html>
